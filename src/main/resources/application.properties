spring.application.name=supplier-catalogue-sync

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Schema and seed data come from schema.sql / data.sql, not from Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# All TIMESTAMP columns hold UTC wall-clock time (effectiveAt is always UTC).
# Hibernate 6 maps java.time.Instant to TIMESTAMP WITH TIME ZONE by default, which makes H2
# convert through the JVM's default zone (seed 00:00 came back as 18:30Z on an IST machine).
# Mapping Instant to a plain TIMESTAMP makes jdbc.time_zone=UTC apply, so results no longer
# depend on the machine's time zone.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Needed to see N+1 problems while developing; keep off for normal runs
spring.jpa.show-sql=false
